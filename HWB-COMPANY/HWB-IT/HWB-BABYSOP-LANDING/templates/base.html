<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BabySOP | Institutional Infrastructure{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hex_standard.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #3b82f6;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--text-primary);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .btn-primary {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-secondary {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 700;
            transition: all 0.2s;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% include "components/mega_bar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="padding: 4rem 0; background: #fff; border-top: 1px solid var(--border); text-align: center;">
        <div class="container">
            <div style="font-weight: 900; color: var(--dark); margin-bottom: 1rem;">BabySOP.com</div>
            <p style="color: var(--text-secondary); font-size: 0.85rem;">&copy; 2026 HWB Cleaning Services LLC. | SigmaFidelity™ Institutional Standard</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
