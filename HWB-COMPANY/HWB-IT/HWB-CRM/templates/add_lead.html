{% extends 'base.html' %}

{% block content %}
<h2>Add New Lead</h2>

<form method="POST">
    <div class="form-group">
        <label for="company_name">Company Name:</label>
        <input type="text" id="company_name" name="company_name" required>
    </div>
    
    <div class="form-group">
        <label for="source">Source:</label>
        <input type="text" id="source" name="source" placeholder="e.g. Website, Referral">
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="New">New</option>
            <option value="Qualified">Qualified</option>
            <option value="Disqualified">Disqualified</option>
            <option value="Converted">Converted</option>
        </select>
    </div>

    <div class="form-group">
        <label for="assigned_to">Assigned To:</label>
        <input type="text" id="assigned_to" name="assigned_to" value="George">
    </div>

    <button type="submit" class="btn">Add Lead</button>
    <a href="{{ url_for('leads_list') }}">Cancel</a>
</form>
{% endblock %}
