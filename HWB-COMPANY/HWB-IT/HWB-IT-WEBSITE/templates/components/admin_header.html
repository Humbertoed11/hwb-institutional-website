<header class="admin-clinical-header" style="background: white; border-bottom: 1px solid var(--slate-200); padding: 0.75rem 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 4000; height: 64px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 2rem;">
        <a href="{{ url_for('admin_operations') }}" style="display: flex; align-items: center; text-decoration: none;">
            <img src="{{ url_for('static', filename='logo_standard.png') }}" alt="HWB" style="height: 32px;">
            <span style="margin-left: 1rem; font-weight: 900; color: var(--slate-900); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; border-left: 2px solid var(--slate-100); padding-left: 1rem;">Backoffice Control</span>
        </a>
    </div>

    <div style="display: flex; align-items: center; gap: 1.5rem;">
        {% if current_user.role in ['Executive', 'Admin'] or (current_user.has_permission and current_user.has_permission('qms', 'view')) %}
        <a href="{{ url_for('manual_index') }}" id="header-qms-manual-btn" class="isc-btn isc-btn-outline" style="height: 32px; font-size: 0.75rem; font-weight: 700; color: var(--slate-700); border-color: var(--slate-300); display: inline-flex; align-items: center; gap: 0.45rem; padding: 0 0.85rem; border-radius: 6px; text-decoration: none;" title="ISO 9001:2015 Quality Management System Manual">
            <i class="fas fa-book" style="color: var(--brand);"></i> QMS Manual
        </a>
        {% endif %}
        <div style="display: flex; flex-direction: column; text-align: right;">
            <span style="font-size: 0.7rem; font-weight: 800; color: var(--brand); text-transform: uppercase;">{{ current_user.username if current_user.is_authenticated else 'Operator' }}</span>
            <span style="font-size: 0.65rem; color: var(--slate-400); font-weight: 700;">HWB Authorized Session</span>
        </div>
        <a href="javascript:void(0)" onclick="openChangePasswordModal()" class="isc-btn isc-btn-outline" style="height: 32px; font-size: 0.75rem; font-weight: 700; color: var(--slate-700); border-color: var(--slate-300); display: inline-flex; align-items: center; gap: 0.45rem; padding: 0 0.85rem; border-radius: 6px; text-decoration: none;" title="Change your account password">
            <i class="fas fa-key" style="color: #64748b;"></i> Password
        </a>
        <a href="javascript:void(0)" onclick="triggerLogoutConfirmation(event)" class="isc-btn isc-btn-outline" style="height: 32px; border-color: #fca5a5; color: #ef4444 !important; font-size: 0.7rem; font-weight: 800;">
            <i class="fas fa-power-off"></i> Logout
        </a>
    </div>
</header>
