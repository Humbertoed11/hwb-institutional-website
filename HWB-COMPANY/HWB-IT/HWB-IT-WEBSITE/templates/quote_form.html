{% extends "base.html" %}

{% block title %}Request a Custom Cleaning Plan | HWB Cleaning Services LLC{% endblock %}

{% block content %}
<section class="section-white">
 <div class="content-wrapper" style="max-width: 1200px;">
 <div class="section-header" style="text-align: center; margin-bottom: 1rem;">
 <h2 style="font-size: 2.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--hwb-dark); letter-spacing: -0.01em;">Company Quote Request</h2>
 <p style="font-size: 1rem; color: var(--hwb-slate); max-width: 750px; margin: 0 auto; font-weight: 500;">Setting up technical scope and contract planning for your DFW building.</p>
 </div>

 <div class="isc-card" style="max-width: 1000px; margin: 0 auto; padding: 3rem; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); border: 1px solid var(--slate-200);">
 <form action="{{ url_for('get_quote') }}" method="POST" id="quote-form-page" class="sigma-form-container">
 <div class="sigma-form-body">
 <div class="sigma-form-section" style="gap: 3rem;">
 
 <!-- Column 1: Building Information -->
 <div class="sigma-form-group">
 <span class="sigma-form-header">Building Information</span>
 
 <div class="sigma-field">
 <label>Building Type</label>
 <select name="facility_type" id="facility_type" required class="sigma-input">
 <option value="office">Professional Office / Corporate</option>
 <option value="medical">Medical / Clinical Building</option>
 <option value="industrial">Warehouse / Logistics Hub</option>
 <option value="daycare">Childcare / Educational</option>
 <option value="worship">House of Worship</option>
 <option value="dealership">Car Dealership</option>
 <option value="other">Other</option>
 </select>
 </div>

 <div class="sigma-field">
 <label>Traffic Cycle Requirement</label>
 <select name="need" id="need" required class="sigma-input">
 <option value="1">Slow Traffic (Reduced Wear)</option>
 <option value="2" selected>High Traffic (Daily Use)</option>
 <option value="3">24/7 Production (Extreme Wear)</option>
 </select>
 </div>

 <div class="sigma-field">
 <label>Service Frequency</label>
 <select name="frequency" id="frequency" required class="sigma-input">
 <option value="Daily (5 Days)">Daily (5 Days)</option>
 <option value="24/7 (7 Days)">24/7 (7 Days)</option>
 <option value="3x Weekly">3x Weekly</option>
 <option value="Weekly">Weekly</option>
 <option value="Bi-Weekly">Bi-Weekly</option>
 </select>
 </div>

 <div class="sigma-field">
 <label style="display: flex; justify-content: space-between;">
 <span>Building size (SQF)</span>
 <strong id="sqft_label_page" style="color: var(--hwb-blue); font-size: 0.95rem; font-weight: 800;">50,000 SQF</strong>
 </label>
 <div class="slider-instrument-container">
 <input type="range" name="sqft" id="sqft_slider_page" min="500" max="1000000" step="500" value="50000" class="sigma-range-instrument" oninput="updateSQFT(this.value)">
 </div>
 </div>
 </div>

 <!-- Column 2: Manager Information -->
 <div class="sigma-form-group">
 <span class="sigma-form-header">Contact Information</span>
 
 <div class="sigma-field">
 <label>Authorized Full Name</label>
 <input type="text" name="name" required placeholder="Manager Name" class="sigma-input">
 </div>

 <div class="sigma-field">
 <label>Company Name</label>
 <input type="text" name="company" required placeholder="Company LLC" class="sigma-input">
 </div>

 <div class="sigma-field">
 <label>Secure Work Email</label>
 <input type="email" name="email" required placeholder="name@company.com" class="sigma-input">
 </div>

 <div class="sigma-field">
 <label>Phone Contact</label>
 <input type="tel" name="phone" id="phone_page" required placeholder="(214) 000-0000" class="sigma-input">
 </div>
 </div>
 </div>
 </div>

 <div class="sigma-form-actions" style="margin-top: 2rem; background: transparent;">
 <button type="submit" id="submit-quote-btn" class="isc-btn isc-btn-primary" style="height: 44px; padding: 0 3rem; font-weight: 700; border-radius: 6px;">
 <span>Start Cleaning Request</span>
 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.5rem;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
 </button>
 </div>
 </form>
 </div>
 </div>
</section>

<style>
 .slider-instrument-container {
 padding: 1rem 0;
 }
 
 .sigma-range-instrument {
 -webkit-appearance: none;
 width: 100%;
 height: 6px;
 background: #f1f5f9;
 border: 1px solid var(--slate-200);
 border-radius: 3px;
 outline: none;
 }

 .sigma-range-instrument::-webkit-slider-thumb {
 -webkit-appearance: none;
 appearance: none;
 width: 14px;
 height: 24px;
 background: var(--hwb-blue);
 border: 2px solid white;
 border-radius: 4px; /* Sharp Handle Aesthetic */
 cursor: pointer;
 box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
 transition: all 0.15s;
 }

 .sigma-range-instrument::-webkit-slider-thumb:hover {
 transform: scaleY(1.1);
 background: #1d4ed8;
 }
</style>

<script>
 function updateSQFT(val) {
 document.getElementById('sqft_label_page').innerText = Number(val).toLocaleString() + " SQF";
 }

 // Phone Masking
 document.getElementById('phone_page').addEventListener('input', function(e) {
 let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
 e.target.value = !x[2] ? x[1] : '(' + x[1] + ')-' + x[2] + (x[3] ? '-' + x[3] : '');
 });

 // Connection Narrative for Public Form
 const quoteForm = document.getElementById('quote-form-page');
 const submitBtn = document.getElementById('submit-quote-btn');
 const btnSpan = submitBtn.querySelector('span');

 quoteForm.onsubmit = function() {
 submitBtn.disabled = true;
 submitBtn.style.opacity = "0.7";
 btnSpan.innerText = "Saving Information...";
 
 let messages = ["Syncing Field Ops...", "Finalizing Scope...", "Sending Request..."];
 let i = 0;
 const interval = setInterval(() => {
 if (i < messages.length) {
 btnSpan.innerText = messages[i];
 i++;
 } else {
 clearInterval(interval);
 }
 }, 700);
 };

 // Auto-populate from URL Parameters (if any)
 document.addEventListener('DOMContentLoaded', function() {
 const params = new URLSearchParams(window.location.search);
 if (params.has('type')) document.getElementById('facility_type').value = params.get('type');
 if (params.has('sqft')) {
 const val = params.get('sqft');
 document.getElementById('sqft_slider_page').value = val;
 updateSQFT(val);
 }
 if (params.has('need')) document.getElementById('need').value = params.get('need');
 });
</script>
{% endblock %}
